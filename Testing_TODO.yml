- id: 17
  name: Test VacuumOnReadAck
  description: >
    VacuumOnReadAck has 0% test coverage. It is an entire vacuum strategy that is never
    exercised by any test. Add a test similar to TestWithVacuum that configures
    VacuumOnReadAck and verifies messages are deleted after being read.
  status: done

- id: 18
  name: Test DBSyncOff
  description: >
    DBSyncOff() has 0% coverage in tests. It is only exercised in benchmarks, which are
    not included in standard coverage runs. Add a test that creates an MQ with DBSyncOff
    and verifies it functions correctly.
  status: done

- id: 19
  name: Test URIFromPath
  description: >
    URIFromPath() is never called in any test. Add tests covering valid paths, paths
    with spaces, and paths requiring directory creation.
  status: done

- id: 20
  name: Test New() error paths
  description: >
    All 5 error paths in New() after sql.Open are untested (Ping failure, Op failure,
    schema failure, optimize failure, metrics failure). Add tests with invalid URIs and
    failing Ops to exercise these paths.
  status: done

- id: 21
  name: Test Stream() with invalid names
  description: >
    The checkStreamName error path in Stream() is never exercised. Add tests with invalid
    characters, empty names, and special characters to verify rejection.
  status: done

- id: 22
  name: Test public API with invalid topics
  description: >
    Publish(), Subscribe(), Queue(), and SubscribeFrom() never have their checkTopic
    error paths tested via the public API. White-box tests exist for checkTopic itself
    but not through the public entry points.
  status: done

- id: 23
  name: Test Queue() with empty key
  description: >
    The "key is empty" error path in Queue() at mq.go:658-659 is never exercised.
    Add a test calling Queue with an empty key string.
  status: done

- id: 24
  name: Test Request() context cancellation
  description: >
    The ctx.Done() branch in Request() at mq.go:763 is never tested. Only the success
    path is exercised. Add a test with a context that cancels before a reply arrives.
  status: done

- id: 25
  name: Test Reply() with nil mq
  description: >
    The "message does not support reply" error at mq.go:359 is never triggered. Add a
    test calling Reply() on a Msg that was not created through Request().
  status: done

- id: 26
  name: Test Close() return value
  description: >
    No test ever checks the return value of Close(). All tests use defer mq.Close()
    without capturing the error. Add tests that verify Close() returns nil on success.
  status: done

- id: 27
  name: Test concurrent Subscribe and Unsubscribe
  description: >
    No test exercises concurrent Subscribe + Unsubscribe, concurrent Stream() creation,
    concurrent Close() calls, or concurrent Queue() calls creating the same group. These
    are the code paths most likely to hit the data races identified in items 3 and 4.
  status: done
